apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asg-mysql-data
  namespace: higress-system
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asg-mysql
  namespace: higress-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: asg-mysql}
  template:
    metadata:
      labels: {app: asg-mysql}
    spec:
      containers:
      - name: mysql
        image: docker.m.daocloud.io/library/mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "Asg@Mysql2026"
        - name: MYSQL_DATABASE
          value: "asg_security"
        - name: MYSQL_USER
          value: "asg"
        - name: MYSQL_PASSWORD
          value: "Asg@Mysql2026"
        - name: TZ
          value: "Asia/Shanghai"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "1", memory: 1Gi}
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: asg-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: asg-mysql
  namespace: higress-system
spec:
  selector: {app: asg-mysql}
  ports:
  - port: 3306
    targetPort: 3306
