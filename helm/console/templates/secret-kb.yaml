{{/*
DEF-002: KB 校签敏感 env（apiKey/licensePrivkey/bundleKey）落 Secret，不入 git。
沿用本 chart secret.yaml 的 lookup 约定：若 asg-kb-env 已存在则原样保留其 data（已是 base64），
否则由 values 明文 b64enc。使“首次经 values-kb-secret.yaml 注入 → 之后升级不清空”成立
（committed values 这三项为空亦不回归）。
*/}}
{{- $existed := (lookup "v1" "Secret" .Release.Namespace "asg-kb-env") }}
{{- $apiKey := "" }}{{- $licensePrivkey := "" }}{{- $bundleKey := "" }}
{{- if $existed }}
  {{- $apiKey = $existed.data.apiKey | default "" }}
  {{- $licensePrivkey = $existed.data.licensePrivkey | default "" }}
  {{- $bundleKey = $existed.data.bundleKey | default "" }}
{{- else }}
  {{- with .Values.asg.kb.apiKey }}{{- $apiKey = . | b64enc }}{{- end }}
  {{- with .Values.asg.kb.licensePrivkey }}{{- $licensePrivkey = . | b64enc }}{{- end }}
  {{- with .Values.asg.kb.bundleKey }}{{- $bundleKey = . | b64enc }}{{- end }}
{{- end }}
{{- if or $apiKey $licensePrivkey $bundleKey }}
apiVersion: v1
kind: Secret
metadata:
  name: asg-kb-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "higress-console.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $apiKey }}
  apiKey: {{ $apiKey }}
  {{- end }}
  {{- if $licensePrivkey }}
  licensePrivkey: {{ $licensePrivkey }}
  {{- end }}
  {{- if $bundleKey }}
  bundleKey: {{ $bundleKey }}
  {{- end }}
{{- end }}
