global:
  local: false # When deploying to a local cluster (e.g.: kind cluster), set this to true.
  kind: false # Deprecated. Please use "global.local" instead. Will be removed later.
  ingressClass: "higress"
  watchNamespace: ""

  proxy:
    # -- CAUTION: It is important to ensure that all Istio helm charts specify the same clusterDomain value
    # cluster domain. Default value is "cluster.local".
    clusterDomain: "cluster.local"

  # -- Default hub (registry) for Higress images, passed from parent chart.
  # Used for plugin image registry when pluginServer.imageRegistry is not set.
  hub: ""
  # -- Plugin image namespace for built-in plugins, passed from parent chart.
  # Used when pluginServer.imageNamespace is not set. Default is "plugins".
  pluginNamespace: ""

  # Observability (o11y) configurations
  o11y:
    enabled: false
    grafana:
      replicas: 1
      image:
        repository: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/grafana
        tag: 9.3.6
      port: 3000
      storage: 1Gi
      pvc:
        storageClassName: ""
      securityContext: {}
    prometheus:
      replicas: 1
      image:
        repository: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/prometheus
        tag: v2.40.7
      port: 9090
      storage: 1Gi
      pvc:
        storageClassName: ""
      resources:
        limits:
          cpu: 500m
          memory: 2Gi
      securityContext: {}
    loki:
      replicas: 1
      image:
        repository: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/loki
        tag: 2.9.4
      ports:
        http: 3100
        grpc: 9095
      storage: 1Gi
      pvc:
        storageClassName: ""
      securityContext: {}

  pvc:
    rwxSupported: false

replicaCount: 1

# Rolling update strategy (ASG production default: multi-replica rolling update)
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

image:
  repository: wntasg-console
  pullPolicy: Never
  tag: "latest"

imagePullSecrets: []
name: ""

podEnvs: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

dnsPolicy: ClusterFirst
restartPolicy: Always
schedulerName: default-scheduler

service:
  type: NodePort
  port: 8080
  nodePort: 30080

ingress:
  enabled: false
  domain: console.higress.io
  tlsSecretName: ""
  annotations: {}
  paths:
    - path: /
      pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
affinity: {}
tolerations: {}

web:
  login:
    prompt: "" # If set, a prompt message will be displayed on the login page.

swagger:
  enabled: false

admin:
  username: admin
  displayName: Admin
  password: "" # If set, the value will be used as the admin password for login.

chat:
  enabled: false
  endpoint: ""

controller:
  serviceName: higress-controller

certmanager:
  enabled: false
  replicas: 1
  image:
    repository: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress
    tag: v1.11.0

o11y:
  __placeholder__: true

pvc:
  __placeholder__: true

pluginServer:
  urlPattern: "http://higress-plugin-server.higress-system.svc/plugins/${name}/${version}/plugin.wasm"
  # -- Plugin image registry for built-in plugins. If set, will override the default registry in plugins.properties.
  # Example: "my-registry.example.com"
  imageRegistry: ""
  # -- Plugin image namespace for built-in plugins. If set, will override the default namespace in plugins.properties.
  # Default namespace is "plugins". Example: "my-plugins"
  imageNamespace: ""

# ASG extension runtime configuration (s3b-rest: externalize application.properties customizations)
asg:
  enabled: false
  collectorToken: "wnt-asg-collector-2026"
  mysql:
    url: "jdbc:mysql://asg-mysql.higress-system:3306/asg_security?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    secretName: "asg-console-mysql"
    ddlAuto: "update"
    dialect: "org.hibernate.dialect.MySQL8Dialect"
  kb:
    # 厂商 KB 更新包 .wnt 外层校签 ECC 公钥（SEC1 压缩点 hex，公开可入仓）
    wntPubkey: "03e74ce745cafa9a6fec00d7e9f306a8d6f643cd2de96361521a89f6e0a471a562"
    # 内层 AES-256-GCM 对称密钥（ASG_KB_BUNDLE_KEY）绝不入仓，仅引用运行期 Secret
    bundleKeySecret: "asg-kb-bundle-key"
    # 可选国密 SM2 公钥（GM 信封校签），留空表示不启用
    sm2Pubkey: ""
